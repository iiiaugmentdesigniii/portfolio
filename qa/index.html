<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QA Test Form | Augment Design</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Shared Site CSS -->
  <link rel="stylesheet" href="/css/style.css?v=6">
</head>

<body class="word-game-page">

  <!-- Shared Header -->
  <div id="site-header"></div>

  <main>

    <div class="game">

      <h1>QA Test Form</h1>

      <p>
        Simple form for practicing manual testing, form validation,
        accessibility and responsive testing.
      </p>

      <form id="qaForm">

        <div>
          <label for="name">
            Name
          </label>

          <input
            type="text"
            id="name"
            name="name"
            required
          >
        </div>


        <div>
          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            name="email"
            required
          >
        </div>


        <div>
          <label for="testType">
            Test Type
          </label>

          <select
            id="testType"
            name="testType"
            required
          >
            <option value="">
              Select a test type
            </option>

            <option value="manual">
              Manual Testing
            </option>

            <option value="accessibility">
              Accessibility Testing
            </option>

            <option value="responsive">
              Responsive Testing
            </option>
          </select>
        </div>


        <div>
          <label for="comments">
            Comments
          </label>

          <textarea
            id="comments"
            name="comments"
            rows="5"
          ></textarea>
        </div>


        <div>
          <input
            type="checkbox"
            id="confirm"
            name="confirm"
          >

          <label for="confirm">
            I have reviewed the information above.
          </label>
        </div>


        <button
          type="submit"
          id="submitButton"
        >
          SUBMIT
        </button>

      </form>

      <p
        id="formResult"
        role="status"
        aria-live="polite"
      ></p>

    </div>

  </main>

  <!-- Shared Footer -->
  <div id="site-footer"></div>

  <!-- Bootstrap JavaScript -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>

  <!-- Shared Components -->
  <script src="/js/components.js?v=5"></script>

</body>

</html>
