<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Guess the Word | Augment Design</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Main portfolio CSS -->
  <link rel="stylesheet" href="../../css/style.css">

  <!-- Word game CSS -->
  <link rel="stylesheet" href="style.css">
</head>


<body>

<div id="site-header"></div>
  

  <main>

    <div class="game">

      <!-- Score / Title -->

      <div class="top-bar">

        <span>
          Score:
          <span id="score">0</span>
        </span>

        <span>
          Guess the Word 12345
        </span>

      </div>


      <!-- Definition -->

      <div class="word-card">

        <p id="definition">
          Definition goes here
        </p>

      </div>


      <!-- Correct / Try Again -->

      <p id="result"></p>


      <!-- Answer Row -->

      <div class="answer-row">

        <input
          type="text"
          id="guessInput"
          placeholder="What word is this?"
          autocomplete="off"
        >

        <button id="hintButton">
          HINT
        </button>

        <button id="showButton">
          SHOW WORD
        </button>

      </div>


      <!-- Hint -->

      <p id="hintText"></p>


      <!-- Game Buttons -->

      <div class="buttons">

        <button id="guessButton">
          GUESS
        </button>

        <button id="addWordButton">
          + ADD WORD
        </button>

        <button id="nextButton">
          NEXT
        </button>

      </div>


      <!-- =========================
           ADD WORD FORM
      ========================== -->

      <div
        id="addWordForm"
        class="add-word-form"
      >

        <h2>
          Add New Word
        </h2>


        <input
          type="text"
          id="newWord"
          placeholder="Word"
        >


        <input
          type="text"
          id="newDefinition"
          placeholder="Definition"
        >


        <input
          type="text"
          id="newHints"
          placeholder="Hints: memory, past, sentimental"
        >


        <div>

          <button id="saveWordButton">
            SAVE
          </button>

          <button id="cancelWordButton">
            CANCEL
          </button>

        </div>

      </div>

    </div>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer class="site-footer py-4">

    <div class="container text-center">

      <small>
        © 2026 iiiaugmentdesigniii
      </small>

    </div>

  </footer>


  <!-- Bootstrap JavaScript -->

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>


  <!-- Word Game JavaScript -->

  <script src="game.js"></script>
  <script src="/js/components.js"></script>

</body>

</html>
