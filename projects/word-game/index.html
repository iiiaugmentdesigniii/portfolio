<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>iiiaugmentdesigniii | Web Design, QA & Digital Design</title>

  <meta
    name="description"
    content="Portfolio featuring web design, front-end development, QA, accessibility, UX/UI, photography and visual design."
  >

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="game">

    <div class="top-bar">
      <span>Score: <span id="score">0</span></span>
      <span>Guess the Word</span>
    </div>

    <div class="word-card">

      <p id="definition">
        Definition goes here
      </p>

    </div>

    <!-- Correct / Try Again -->
    <p id="result"></p>

    <!-- Input, Hint and Show Word -->
    <div class="answer-row">

      <input
        type="text"
        id="guessInput"
        placeholder="What word is this?"
        autocomplete="off"
      >

      <button id="hintButton">HINT</button>

      <button id="showButton">SHOW WORD</button>

    </div>

    <!-- Hint appears here -->
    <p id="hintText"></p>

    <!-- Guess and Next -->
    <div class="buttons">

      <button id="guessButton">GUESS</button>
        <button id="addWordButton">+ ADD WORD</button>
      <button id="nextButton">NEXT</button>

      

    </div>
    <div id="addWordForm" class="add-word-form">

  <h2>Add New Word</h2>

  <input
    type="text"
    id="newWord"
    placeholder="Word"
  >

  <input
    type="text"
    id="newDefinition"
    placeholder="Definition"
  >

  <input
    type="text"
    id="newHints"
    placeholder="Hints: memory, past, sentimental"
  >

  <div>
    <button id="saveWordButton">SAVE</button>
    <button id="cancelWordButton">CANCEL</button>
  </div>

</div>
    <br>
    

  </div>

  <script src="game.js"></script>

</body>

</html>
