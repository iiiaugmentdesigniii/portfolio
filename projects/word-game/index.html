<body class="word-game-page">

  <!-- Shared Header -->
  <div id="site-header"></div>

  <main>

    <div class="game">

      <!-- Score / Title -->
      <div class="top-bar">

        <span>
          Score1:
          <span id="score">0</span>
        </span>

        <span>
          Guess the Word
        </span>

      </div>

      <!-- Definition -->
      <div class="word-card">

        <p id="definition">
          Definition goes here
        </p>

      </div>

      <!-- Correct / Try Again -->
      <p id="result"></p>

      <!-- Answer Row -->
      <div class="answer-row">

        <input
          type="text"
          id="guessInput"
          placeholder="What word is this?"
          autocomplete="off"
        >

        <button
          id="hintButton"
          type="button"
        >
          HINT
        </button>

        <button
          id="showButton"
          type="button"
        >
          SHOW WORD
        </button>

      </div>

      <!-- Hint -->
      <p id="hintText"></p>

      <!-- Game Buttons -->
      <div class="buttons">

        <button
          id="guessButton"
          type="button"
        >
          GUESS
        </button>

        <button
          id="addWordButton"
          type="button"
        >
          + ADD WORD
        </button>

        <button
          id="nextButton"
          type="button"
        >
          NEXT
        </button>

      </div>

      <!-- Add Word Form -->
      <div
        id="addWordForm"
        class="add-word-form"
      >

        <h2>
          Add New Word
        </h2>

        <input
          type="text"
          id="newWord"
          placeholder="Word"
        >

        <input
          type="text"
          id="newDefinition"
          placeholder="Definition"
        >

        <input
          type="text"
          id="newHints"
          placeholder="Hints: memory, past, sentimental"
        >

        <div class="add-word-buttons">

          <button
            id="saveWordButton"
            type="button"
          >
            SAVE
          </button>

          <button
            id="cancelWordButton"
            type="button"
          >
            CANCEL
          </button>

        </div>

      </div>

    </div>

  </main>

  <!-- Shared Footer -->
  <div id="site-footer"></div>

  <!-- Bootstrap JavaScript
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script> -->

  <!-- Shared Components -->
  <script src="/js/components.js"></script>

  <!-- Word Game JavaScript -->
  <script src="game.js"></script>

</body>

</html>
