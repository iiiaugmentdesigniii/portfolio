<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Guess the Word | Augment Design</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Main portfolio CSS -->
  <link rel="stylesheet" href="../../css/style.css">

  <!-- Word game CSS -->
  <link rel="stylesheet" href="style.css">
</head>


<body>

  <!-- =========================
       HEADER / NAVIGATION
  ========================== -->

<header>

  <nav class="navbar navbar-expand-lg navbar-dark py-4">
    <div class="container-fluid px-4 px-lg-5">

      <a class="navbar-brand d-flex align-items-center" href="#">
        <span class="brand-mark">III</span>
        <span class="brand-name ms-2">AUGMENT DESIGN</span>
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNav"
        aria-controls="mainNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">

          <li class="nav-item">
            <a class="nav-link" href="#work">Work</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#web">Web</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#qa">QA</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#design">Design</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#photo">Photo</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#about">About</a>
          </li>

          <li class="nav-item ms-lg-2">
            <a class="btn btn-light contact-btn" href="#contact">
              Contact
            </a>
          </li>

        </ul>
      </div>

    </div>
  </nav>

</header>
  

  <main>

    <div class="game">

      <!-- Score / Title -->

      <div class="top-bar">

        <span>
          Score:
          <span id="score">0</span>
        </span>

        <span>
          Guess the Word 12345
        </span>

      </div>


      <!-- Definition -->

      <div class="word-card">

        <p id="definition">
          Definition goes here
        </p>

      </div>


      <!-- Correct / Try Again -->

      <p id="result"></p>


      <!-- Answer Row -->

      <div class="answer-row">

        <input
          type="text"
          id="guessInput"
          placeholder="What word is this?"
          autocomplete="off"
        >

        <button id="hintButton">
          HINT
        </button>

        <button id="showButton">
          SHOW WORD
        </button>

      </div>


      <!-- Hint -->

      <p id="hintText"></p>


      <!-- Game Buttons -->

      <div class="buttons">

        <button id="guessButton">
          GUESS
        </button>

        <button id="addWordButton">
          + ADD WORD
        </button>

        <button id="nextButton">
          NEXT
        </button>

      </div>


      <!-- =========================
           ADD WORD FORM
      ========================== -->

      <div
        id="addWordForm"
        class="add-word-form"
      >

        <h2>
          Add New Word
        </h2>


        <input
          type="text"
          id="newWord"
          placeholder="Word"
        >


        <input
          type="text"
          id="newDefinition"
          placeholder="Definition"
        >


        <input
          type="text"
          id="newHints"
          placeholder="Hints: memory, past, sentimental"
        >


        <div>

          <button id="saveWordButton">
            SAVE
          </button>

          <button id="cancelWordButton">
            CANCEL
          </button>

        </div>

      </div>

    </div>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer class="site-footer py-4">

    <div class="container text-center">

      <small>
        © 2026 iiiaugmentdesigniii
      </small>

    </div>

  </footer>


  <!-- Bootstrap JavaScript -->

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>


  <!-- Word Game JavaScript -->

  <script src="game.js"></script>

</body>

</html>
